# UC-48 — folders emptied by the move are pruned; one with a leftover is not.
#
# alpha/ and alpha/beta/ contain only photos, which move to 2011/06/ — both
# become empty and are pruned. gamma/ also loses its photo but keeps a
# non-media file the organiser does not manage, so gamma/ stays.

version = 1

[[files]]
path = "alpha/one.jpg"
source = "seed"
width = 320
exif = { DateTimeOriginal = "2011-06-14 08:00:00" }

[[files]]
path = "alpha/beta/two.jpg"
source = "seed"
width = 320
exif = { DateTimeOriginal = "2011-06-14 09:00:00" }

[[files]]
path = "gamma/three.jpg"
source = "seed"
width = 320
exif = { DateTimeOriginal = "2011-06-14 10:00:00" }

[[files]]
path = "gamma/keep.txt"
source = "forge"
kind = "bytes"
params = { content = "just some notes the tool does not touch\n" }
