# UC-24 — a truncated JPEG is detected as unreadable.
#
# One file: a valid JPEG header followed by only its first 4 096 scan bytes,
# the way a bad CD sector leaves it. This recipe started life in US-00-05 as a
# six-file warm-up that exercised every forged `kind` at once; it has been
# trimmed to the single example UC-24 needs. The empty file moved to UC-25 and
# the junk file to UC-26; the AVI, MOV and ZIP entries were dropped because
# UC-20, UC-21 and UC-23 already carry their own.

version = 1

[[files]]
path = "damaged/corrupt-scan.jpg"
source = "forge"
kind = "truncated-jpeg"
params = { keep_bytes = 4096 }
