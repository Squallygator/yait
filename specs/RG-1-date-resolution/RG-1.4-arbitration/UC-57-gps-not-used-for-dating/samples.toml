# UC-57 — GPS metadata is not a date source.
#
# A still with NO capture-date tag but a PRESENT GPSDateStamp, in a month-dated
# folder. The stamp is 2013-06-30: the UTC fix naming the day before the folder's
# month, exactly the "different calendar day" the rule warns about. An
# implementation that read GPS as a fallback would resolve 2013-06-30, day
# precision, from embedded-metadata; the folder answer is 2013-07, month
# precision, from folder-name. The two cannot agree by accident.

version = 1

[[files]]
path = "2013-07 Sicily/DSCN2043.JPG"
source = "seed"
width = 320
exif = { GPSDateStamp = "2013-06-30 00:00:00" }
